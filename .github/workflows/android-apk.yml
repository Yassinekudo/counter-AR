name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ShelfSense-AR-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ShelfSense-AR.apk
      - name: Publish the APK as the "latest" release (one direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ShelfSense AR (latest build)
          body: "Download ShelfSense-AR.apk below and open it on your Android phone. Built from ${{ github.sha }}."
          files: ShelfSense-AR.apk
          make_latest: true
